<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #fff; --text: #1d2330; --muted: #6b7385;
    --line: #e2e5ec; --accent: #2f5bea; --danger: #c2362b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171f; --surface: #1c202b; --text: #e8eaf0; --muted: #8b93a7; --line: #2b3040; --accent: #7b9bff; --danger: #ff7a6e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 20px; }
  h1 { font-size: 1.6rem; margin: 0 0 24px; }
  form { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 24px; }
  input, textarea { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
  textarea { resize: vertical; min-height: 60px; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 6px; padding: 6px 12px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; justify-self: start; }
  button.danger { color: var(--danger); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  li { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  li input[type=checkbox] { width: auto; margin-top: 6px; }
  .body { flex: 1; min-width: 0; }
  .title { font-weight: 600; overflow-wrap: anywhere; }
  .desc { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
  li.done .title { text-decoration: line-through; color: var(--muted); }
  .actions { display: flex; gap: 6px; }
  .empty, .error { color: var(--muted); text-align: center; padding: 24px 0; }
  .error { color: var(--danger); }
</style>
</head>
<body>
<main>
  <h1>Tasks</h1>
  <form id="form">
    <input id="title" placeholder="What needs doing?" required maxlength="200" aria-label="Title">
    <textarea id="desc" placeholder="Details (optional)" aria-label="Description"></textarea>
    <button class="primary" id="submit" type="submit">Add task</button>
  </form>
  <p class="error" id="error" hidden></p>
  <ul id="list"></ul>
</main>

<script>
const $ = (id) => document.getElementById(id);
let editingId = null;

async function api(path, options = {}) {
  const res = await fetch('/api/tasks' + path, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.error || 'Request failed');
  }
  return res.status === 204 ? null : res.json();
}

function showError(msg) {
  $('error').textContent = msg || '';
  $('error').hidden = !msg;
}

async function load() {
  try {
    showError('');
    render(await api(''));
  } catch (e) { showError(e.message); }
}

function render(tasks) {
  const list = $('list');
  list.innerHTML = '';
  if (!tasks.length) {
    list.innerHTML = '<p class="empty">No tasks yet. Add your first one above.</p>';
    return;
  }
  for (const t of tasks) {
    const li = document.createElement('li');
    if (t.done) li.className = 'done';

    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = t.done;
    cb.setAttribute('aria-label', 'Mark done');
    cb.onchange = () => act(() => api('/' + t.id, { method: 'PUT', body: JSON.stringify({ done: cb.checked }) }));

    const body = document.createElement('div');
    body.className = 'body';
    const title = document.createElement('div');
    title.className = 'title'; title.textContent = t.title;
    const desc = document.createElement('div');
    desc.className = 'desc'; desc.textContent = t.description;
    body.append(title, desc);

    const actions = document.createElement('div');
    actions.className = 'actions';
    const edit = document.createElement('button');
    edit.textContent = 'Edit';
    edit.onclick = () => {
      editingId = t.id;
      $('title').value = t.title; $('desc').value = t.description;
      $('submit').textContent = 'Save changes';
      $('title').focus();
    };
    const del = document.createElement('button');
    del.textContent = 'Delete'; del.className = 'danger';
    del.onclick = () => act(() => api('/' + t.id, { method: 'DELETE' }));
    actions.append(edit, del);

    li.append(cb, body, actions);
    list.append(li);
  }
}

async function act(fn) {
  try { showError(''); await fn(); await load(); }
  catch (e) { showError(e.message); }
}

$('form').onsubmit = (e) => {
  e.preventDefault();
  const payload = JSON.stringify({ title: $('title').value, description: $('desc').value });
  const request = editingId
    ? () => api('/' + editingId, { method: 'PUT', body: payload })
    : () => api('', { method: 'POST', body: payload });
  act(async () => {
    await request();
    editingId = null;
    $('form').reset();
    $('submit').textContent = 'Add task';
  });
};

load();
</script>
</body>
</html>
